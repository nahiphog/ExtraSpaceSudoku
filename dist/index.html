<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Generate Extra Space Sudoku shading patterns." />
    <title>Extra Space Sudoku</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero" aria-labelledby="page-title">
        <div class="eyebrow"><span></span> pattern studio</div>
        <h1 id="page-title">Extra Space<br /><em>Sudoku</em></h1>
        <p class="intro">A calm, empty grid with a precise spatial rule: three shaded cells in every row, column, and box.</p>
        <button id="generate" class="generate-button" type="button">
          <span class="spark">✦</span> Generate <span class="shortcut">G</span>
        </button>
        <label class="symmetry-toggle" for="symmetry">
          <input id="symmetry" type="checkbox" />
          <span class="toggle-track" aria-hidden="true"><span></span></span>
          <span><strong>Rotational symmetry</strong><small>Match the grid after a 180° turn</small></span>
        </label>
        <p id="status" class="status" aria-live="polite">Ready for a new arrangement.</p>
      </section>

      <section class="board-panel" aria-label="Generated Extra Space Sudoku grid">
        <div class="panel-topline">
          <span>09 × 09 grid</span>
          <span class="live-dot">● live pattern</span>
        </div>
        <div id="grid" class="sudoku-grid" role="grid" aria-label="Extra Space Sudoku shading pattern"></div>
        <div class="legend"><span class="legend-swatch"></span> Grey cells mark the extra spaces</div>
      </section>
    </main>
    <footer><span>EXTRA SPACE SUDOKU</span><span>Every line holds exactly three spaces.</span></footer>
    <script src="./app.js"></script>
  </body>
</html>
